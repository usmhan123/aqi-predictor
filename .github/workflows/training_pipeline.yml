name: Training Pipeline (daily)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy scikit-learn joblib python-dotenv hopsworks confluent-kafka pyjks

      - name: Run training pipeline
        env:
          CITY_NAME: ${{ vars.CITY_NAME }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ vars.HOPSWORKS_PROJECT }}
          HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST }}
        run: python training_pipeline.py || echo "Training skipped -- not enough data yet"

      - name: Commit updated model
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ || true
          git diff --cached --quiet || git commit -m "Update trained model [automated]"
          git push || true